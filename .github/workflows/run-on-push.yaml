name: Test and check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pipenv
      - run: python -m pip install "pipenv==2026.0.3"
      - run: pipenv sync --dev
      - run: pipenv run pytest
      - run: pipenv run python -m compileall -q lib models torrentino.py

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pipenv
      - run: python -m pip install "pipenv==2026.0.3"
      - run: pipenv sync --dev
      - run: pipenv run black --workers 1 --check lib models tests torrentino.py
      - run: pipenv run flake8
      - run: pipenv run mypy lib models tests torrentino.py
      - run: XDG_CACHE_HOME=/tmp/pip-audit-cache pipenv run pip-audit

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
