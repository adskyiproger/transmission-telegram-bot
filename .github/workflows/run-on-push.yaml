name: Run Linters and Checkers
# Test sync
on:
  push
jobs:
    flake8:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout code
          uses: actions/checkout@v2

        - name: Set up Python
          uses: actions/setup-python@v2
          with:
            python-version: 3.13

        - name: Install dependencies
          run: |
            pip install --user pipenv && \
            pipenv install && \
            pipenv install --dev && \
            pipenv run flake8
        - name: Flake8
          run: |
            pipenv run flake8

    mypy:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout code
            uses: actions/checkout@v2

          - name: Get the short commit SHA
            id: get_commit_sha
            run: echo "commit_sha=$(git rev-parse HEAD | cut -c 1-7)" >> $GITHUB_OUTPUT
            
          - name: Use the commit SHA
            run: |
                echo "The short commit SHA is ${{ steps.get_commit_sha.outputs.commit_sha }}"
                env