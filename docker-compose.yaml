# Update required before running this file with docker-compose
# - <dnla uid>, User ID on host system, must have access write to download folder
# - <dnla guid>, Group ID on host system, must have access read or write to download folder,
#                depends on how access is organised, by group or user
# - <download folder on host>, Path to download folder on host system
# - <config folder on host>, Path to configuration folder on host system
---
services:
  # Uncomment to add jellyfin service
  # jellyfin:
  #   image: ghcr.io/linuxserver/jellyfin
  #   container_name: jellyfin
  #   environment:
  #     - PUID=<dnla uid>
  #     - PGID=<dnla guid>
  #     - TZ=Europe/London
  #   volumes:
  #     - <download folder on host>/Video:/Video
  #     - <download folder on host>/TVShows:/TVShows
  #     - <config folder on host>/jellyfin/config:/config
  #   ports:
  #     - 8096:8096
  #     - 8920:8920 
  #     - 7359:7359/udp 
  #     - 1900:1900/udp 
  #   restart: "unless-stopped"
  #   network_mode: "host"
  torrentino:
    image: ghcr.io/adskyiproger/transmission-telegram-bot:latest
    container_name: transmission-telegram-bot
    # Transmission connection properties
    environment:
      # Transmission connection properties
      - TRANSMISSION_HOST=transmission
      - TRANSMISSION_PORT=9091
      - TRANSMISSION_USER=${TRANSMISSION_USER:?set TRANSMISSION_USER}
      - TRANSMISSION_PASSWORD=${TRANSMISSION_PASSWORD:?set TRANSMISSION_PASSWORD}
      - TOKEN=${TOKEN:?set TOKEN}
      - SUPER_USER=${SUPER_USER:?set SUPER_USER}
    depends_on:
      transmission:
        condition: service_healthy
    restart: unless-stopped
    # Uncomment this line if you need to persist you configuration
    # in local folder or docker volume
    # volumes:
    # 1. Local folder example
    #   - ./config:/usr/src/app/config
    # 2. Docker volume example
    #   - config:/usr/src/app/config
  transmission:
    image: lscr.io/linuxserver/transmission:4.1.1-r1-ls345
    container_name: transmission
    environment:
      # Uncomment to grant correct permissions
      # - PUID=<dnla uid>
      # - PGID=<dnla guid>
      - TZ=Europe/London
      - USER=${TRANSMISSION_USER:?set TRANSMISSION_USER}
      - PASS=${TRANSMISSION_PASSWORD:?set TRANSMISSION_PASSWORD}
    volumes:
      # Modify this section to add external volumes
      - downloads:/downloads
    ports:
      - 9091:9091
      - 51413:51413
      - 51413:51413/udp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9091/transmission/web/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

# Temporal volume for testing
# Please check: https://docs.docker.com/reference/compose-file/volumes/
volumes:
  downloads: {}
  config: {}
