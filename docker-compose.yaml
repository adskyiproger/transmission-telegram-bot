# Required environment variables are documented in README.md.
# Set PUID and PGID below when host-mounted download directories require a
# specific Linux user or group.
---
services:
  # Uncomment to add jellyfin service
  # jellyfin:
  #   image: ghcr.io/linuxserver/jellyfin
  #   container_name: jellyfin
  #   environment:
  #     - PUID=<dnla uid>
  #     - PGID=<dnla guid>
  #     - TZ=Europe/London
  #   volumes:
  #     - <download folder on host>/Video:/Video
  #     - <download folder on host>/TVShows:/TVShows
  #     - <config folder on host>/jellyfin/config:/config
  #   ports:
  #     - 8096:8096
  #     - 8920:8920 
  #     - 7359:7359/udp 
  #     - 1900:1900/udp 
  #   restart: "unless-stopped"
  #   network_mode: "host"
  torrentino:
    image: ghcr.io/adskyiproger/transmission-telegram-bot:${TORRENTINO_VERSION:-latest}
    container_name: transmission-telegram-bot
    # Transmission connection properties
    environment:
      # Transmission connection properties
      - TRANSMISSION_HOST=transmission
      - TRANSMISSION_PORT=9091
      - TRANSMISSION_USER=${TRANSMISSION_USER:?set TRANSMISSION_USER}
      - TRANSMISSION_PASSWORD=${TRANSMISSION_PASSWORD:?set TRANSMISSION_PASSWORD}
      - TOKEN=${TOKEN:?set TOKEN}
      - SUPER_USER=${SUPER_USER:?set SUPER_USER}
      - DOWNLOAD_LOG=/usr/src/app/config/download.log
      - LOG_FILE=/usr/src/app/config/torrentino.log
    depends_on:
      transmission:
        condition: service_healthy
    restart: unless-stopped
    # Persist configuration, authorized users, download history, and logs.
    volumes:
      - config:/usr/src/app/config
  transmission:
    image: lscr.io/linuxserver/transmission:4.1.1-r1-ls345
    container_name: transmission
    environment:
      # Uncomment to grant correct permissions
      # - PUID=<dnla uid>
      # - PGID=<dnla guid>
      - TZ=Europe/London
      - USER=${TRANSMISSION_USER:?set TRANSMISSION_USER}
      - PASS=${TRANSMISSION_PASSWORD:?set TRANSMISSION_PASSWORD}
    volumes:
      # Modify this section to add external volumes
      - downloads:/downloads
    ports:
      - 9091:9091
      - 51413:51413
      - 51413:51413/udp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9091/transmission/web/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

# Named volumes persist downloads and bot configuration across container
# recreation. Replace them with bind mounts when host access is required.
volumes:
  downloads: {}
  config: {}
